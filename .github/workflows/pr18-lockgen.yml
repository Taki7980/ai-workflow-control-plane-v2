name: PR18 Lock Generator

on:
  push:
    branches:
      - build/pr-18-hermetic-python-inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.14"
          enable-cache: false
      - name: Generate universal lock
        shell: bash
        run: |
          set -euo pipefail
          uv --version
          uv lock
          uv lock --check
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          raw = Path("uv.lock").read_bytes()
          encoded = base64.b64encode(gzip.compress(raw, mtime=0)).decode("ascii")
          print("PR18_LOCK_GZIP_BASE64_BEGIN")
          print(encoded)
          print("PR18_LOCK_GZIP_BASE64_END")
          print(f"PR18_LOCK_BYTES={len(raw)}")
          PY
