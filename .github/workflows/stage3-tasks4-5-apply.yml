name: Stage3 Tasks4-5 Apply

on:
  push:
    branches:
      - research/stage3-complete-retrieval
    paths:
      - .github/workflows/stage3-tasks4-5-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/stage3-complete-retrieval
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Write Stage 3 Tasks 4-5 tests
        run: python scripts/stage3_tasks_4_5.py tests
      - name: Confirm red phase
        shell: bash
        run: |
          if python -m unittest tests.test_scoped_retrieval tests.test_workspace_retrieval -v; then
            echo "Expected scoped/workspace retrieval tests to fail before implementation"
            exit 1
          fi
          echo "Red phase confirmed"
      - name: Apply Stage 3 Tasks 4-5 implementation
        run: python scripts/stage3_tasks_4_5.py impl
      - name: Preserve existing lightweight cutoff semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ai_workflow/context_broker.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def lightweight(")
          end = text.index("def _run_crg(", start)
          corrected = '''def lightweight(
              root: Path,
              query: str,
              symbol: str | None,
              endpoint: str | None,
              limit: int,
              min_conf: float,
              *,
              workspace_root: Path | None = None,
              repository_path: str = ".",
              child_repository_paths: tuple[str, ...] = (),
          ) -> list[ContextItem]:
              index_root = Path(workspace_root).resolve() if workspace_root is not None else Path(root).resolve()
              state = load_state(index_root)
              out: list[ContextItem] = []
              for raw in _jsonl(index_root / "ai-workspace/generated/symbol-index.jsonl"):
                  mapped = _scope_index_row(raw, repository_path, child_repository_paths)
                  if mapped is None:
                      continue
                  row, original = mapped
                  target = symbol or query
                  score = 10 if symbol and row.get("symbol", "").lower() == symbol.lower() else _semantic_overlap_score(target, f"{row.get('symbol','')} {row.get('file','')}")
                  if score and _scoped_row_fresh(root, row, original, state):
                      out.append(ContextItem("lightweight_index", json.dumps(row, separators=(",", ":")), float(score), False, {"kind": "symbol"}))
              for raw in _jsonl(index_root / "ai-workspace/generated/endpoint-index.jsonl"):
                  mapped = _scope_index_row(raw, repository_path, child_repository_paths)
                  if mapped is None:
                      continue
                  row, original = mapped
                  target = endpoint or query
                  score = 10 if endpoint and endpoint.lower() in row.get("path", "").lower() else _semantic_overlap_score(target, f"{row.get('method','')} {row.get('path','')} {row.get('file','')}")
                  if score and _scoped_row_fresh(root, row, original, state):
                      out.append(ContextItem("lightweight_index", json.dumps(row, separators=(",", ":")), float(score), False, {"kind": "endpoint"}))
              out.extend(_domain_hints(index_root, query, limit))
              out.extend(_research_hits(index_root, query, limit))
              for memory in search_memory(index_root, query, limit=limit, minimum_confidence=min_conf, exclude_stale=True):
                  compact = {key: memory.get(key) for key in ("id", "type", "summary", "evidence", "files", "confidence")}
                  out.append(ContextItem("durable_memory", json.dumps(compact, ensure_ascii=False, separators=(",", ":")), float(memory.get("score", 0)), False))
              out.sort(key=lambda item: -item.score)
              if len(out) <= limit or not query:
                  return out[:limit]

              cutoff_score = out[limit - 1].score
              stronger = [item for item in out if item.score > cutoff_score]
              tied = [item for item in out if item.score == cutoff_score]
              slots = limit - len(stronger)
              if slots <= 0 or len(tied) <= slots:
                  return out[:limit]

              bm25 = BM25Scorer()
              bm25.fit([item.text for item in tied], tied)
              lexical_scores = {id(item): score for score, item in bm25.rank(query)}
              selected = sorted(
                  tied,
                  key=lambda item: (
                      -lexical_scores.get(id(item), 0.0),
                      item.dedupe_key,
                  ),
              )[:slots]
              selected_ids = {id(item) for item in selected}
              return stronger + [item for item in tied if id(item) in selected_ids]

          '''
          corrected = "\n".join(line[10:] if line.startswith("          ") else line for line in corrected.splitlines()) + "\n"
          path.write_text(text[:start] + corrected + text[end:], encoding="utf-8")
          PY
      - name: Verify focused Stage 3 retrieval tests
        run: python -m unittest tests.test_scoped_retrieval tests.test_workspace_retrieval -v
      - name: Verify existing retrieval regressions
        run: python -m unittest tests.test_context_broker tests.test_adaptive_broker tests.test_workflow_engine tests.test_workspace_selector tests.test_workspace_budget -v
      - name: Verify full unit suite and compile
        shell: bash
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q ai_workflow
      - name: Commit repository-scoped retrieval
        shell: bash
        run: |
          git config user.name "Stage3 CI"
          git config user.email "actions@users.noreply.github.com"
          git add ai_workflow/context_broker.py ai_workflow/workflow_engine.py ai_workflow/adaptive_broker.py tests/test_scoped_retrieval.py
          git commit -m "feat: scope retrieval to one repository"
      - name: Commit workspace retrieval orchestration
        shell: bash
        run: |
          git add ai_workflow/workspace_retrieval.py tests/test_workspace_retrieval.py
          git commit -m "feat: orchestrate bounded multi-repo retrieval"
          git push origin HEAD:research/stage3-complete-retrieval
