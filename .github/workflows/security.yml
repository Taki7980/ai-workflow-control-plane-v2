name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync locked security and build tools
        run: >-
          uv sync --locked --no-default-groups
          --group security --group build --no-install-project
      - name: Record security toolchain identity
        shell: bash
        run: |
          uv run --locked --no-sync python scripts/record_python_toolchain.py \
            --package build \
            --package setuptools \
            --package coverage \
            --package hypothesis \
            --package pip-audit \
            --package pip-licenses \
            --package ruff \
            --output "$RUNNER_TEMP/security-toolchain.json"
          cat "$RUNNER_TEMP/security-toolchain.json"
      - name: SAST security rules
        run: >-
          uv run --locked --no-sync ruff check --select S
          --ignore S101,S404,S603,S607
          ai_workflow scripts
      - name: Audit project dependency graph
        run: uv run --locked --no-sync pip-audit --strict .
      - name: Run adversarial property tests
        run: uv run --locked --no-sync python -m unittest discover -s security_tests -v
      - name: Enforce test coverage floor
        run: |
          uv run --locked --no-sync coverage run --branch --source=ai_workflow -m unittest discover -s tests -q
          uv run --locked --no-sync coverage report --fail-under=80 --show-missing
      - name: Enforce runtime dependency license policy
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/runtime-license"
          wheel_dir="$RUNNER_TEMP/runtime-wheel"
          mkdir -p "$wheel_dir"
          uv run --locked --no-sync python -m build --wheel --no-isolation --outdir "$wheel_dir"
          python -m venv "$runtime"
          "$runtime/bin/python" -m pip install --no-deps "$wheel_dir"/*.whl
          allowed='MIT;MIT License;Apache-2.0;Apache Software License;BSD License;BSD-2-Clause;BSD-3-Clause;ISC;ISC License (ISCL);MPL-2.0;Mozilla Public License 2.0 (MPL 2.0);Python Software Foundation License'
          uv run --locked --no-sync pip-licenses             --python "$runtime/bin/python"             --ignore-packages pip setuptools             --allow-only "$allowed"             --partial-match

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          asset="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location             --output "$RUNNER_TEMP/$asset"             "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$asset"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$asset" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" gitleaks
      - name: Scan Git history for secrets
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.37.0
          driver-opts: >-
            image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - name: Derive reproducible source timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Build container for scanning from pinned inputs
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        run: >-
          docker buildx build
          --load
          --platform linux/amd64
          --build-arg SOURCE_DATE_EPOCH
          --tag ai-workflow-security:ci
          .
      - name: Install checksum-verified Trivy
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          version="0.74.0"
          checksums="trivy_${version}_checksums.txt"
          asset="trivy_${version}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${version}"
          curl --fail --silent --show-error --location --output "$checksums" "$base/$checksums"
          echo "bc701c3c3ee8b9acbea2c23257e41381e3854888f51281616a6ba5dc96963821  $checksums" | sha256sum --check -
          curl --fail --silent --show-error --location --output "$asset" "$base/$asset"
          grep "  $asset$" "$checksums" | sha256sum --check -
          tar -xzf "$asset" trivy
      - name: Block high and critical container vulnerabilities
        shell: bash
        run: >-
          "$RUNNER_TEMP/trivy" image
          --scanners vuln
          --severity HIGH,CRITICAL
          --ignorefile security/trivy-ignore.yaml
          --ignore-unfixed
          --exit-code 1
          --timeout 10m
          ai-workflow-security:ci
