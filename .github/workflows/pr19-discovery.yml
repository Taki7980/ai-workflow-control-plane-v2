name: PR19 Container Input Discovery

on:
  push:
    branches:
      - build/pr-19-hermetic-container
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inspect immutable image inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "=== BUILDX ==="
          docker buildx version
          echo "=== PYTHON IMAGE ==="
          docker buildx imagetools inspect python:3.12.14-slim-trixie
          echo "=== DOCKERFILE FRONTEND ==="
          docker buildx imagetools inspect docker/dockerfile:1.27.0
      - name: Inspect frozen Debian package candidates
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm python:3.12.14-slim-trixie sh -euxc '
            cat /etc/os-release
            rm -f /etc/apt/sources.list /etc/apt/sources.list.d/debian.sources
            cat > /etc/apt/sources.list <<EOF
          deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20260919T000000Z trixie main
          deb [check-valid-until=no] https://snapshot.debian.org/archive/debian-security/20260919T000000Z trixie-security main
          EOF
            apt-get update
            for pkg in git ripgrep ca-certificates; do
              echo "=== PACKAGE:$pkg ==="
              apt-cache policy "$pkg"
            done
          '
