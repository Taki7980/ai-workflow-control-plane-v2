name: Stage3 Tasks6-8 Apply

on:
  push:
    branches:
      - research/stage3-complete-retrieval
    paths:
      - .github/workflows/stage3-tasks6-8-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/stage3-complete-retrieval
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Write Tasks 6-8 regression tests
        run: python scripts/stage3_tasks_6_8.py tests
      - name: Confirm red phase
        shell: bash
        run: |
          if python -m unittest tests.test_benchmark_metrics -v; then
            echo "Expected Stage 3 benchmark metric tests to fail before implementation"
            exit 1
          fi
          echo "Red phase confirmed"
      - name: Apply Tasks 6-7 implementation
        run: python scripts/stage3_tasks_6_8.py impl
      - name: Apply Task 8 docs and quality targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/tests.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          targets = (
              '          ai_workflow/workspace_selector.py\n'
              '          ai_workflow/workspace_budget.py\n'
              '          ai_workflow/workspace_retrieval.py\n'
          )
          if 'ai_workflow/workspace_selector.py' not in workflow:
              ruff_marker = '          scripts/check_benchmark_regression.py\n'
              if workflow.count(ruff_marker) != 1:
                  raise RuntimeError('ruff insertion marker changed')
              workflow = workflow.replace(ruff_marker, targets + ruff_marker, 1)
              mypy_start = workflow.index('      - name: Mypy typed-boundary gate')
              mypy_marker = '          ai_workflow/provider_runner.py\n'
              marker_at = workflow.index(mypy_marker, mypy_start)
              workflow = workflow[:marker_at + len(mypy_marker)] + targets + workflow[marker_at + len(mypy_marker):]
              workflow_path.write_text(workflow, encoding='utf-8')

          docs_path = Path('docs/multi-repo-workspace-registry.md')
          docs = docs_path.read_text(encoding='utf-8')
          if '## Stage 3 retrieval orchestration' not in docs:
              docs += '''\n\n## Stage 3 retrieval orchestration\n\nAccepted repositories are retrieval **candidates**, not repositories that are searched automatically. `brief` and `context` score the accepted candidate set deterministically and search at most three repositories by default. A strong secondary-repository signal can outrank the primary repository; unrelated accepted repositories remain skipped.\n\nAll selected repositories share one parent context budget. The rank-1 repository receives the strongest allocation, per-repository slices are bounded, and the sum of allocations and final merged evidence never exceeds the parent budget. Repository retrieval runs with at most three workers under one 12-second monotonic workspace deadline by default. A timed-out or failed repository is reported and is not retried or replaced by an unselected repository.\n\nChanged files are partitioned to their owning repository before repository-local retrieval. Every merged context item carries portable `repository_id`, `repository_path`, and `repository_fingerprint` provenance; absolute checkout paths are not serialized into portable evidence. Identical evidence text from two repositories remains distinct because cross-repository deduplication includes repository identity.\n\n`ai-workflow brief` and `ai-workflow context` preserve the existing retrieval fields and add `retrieval.workspace_orchestration`. That block reports the aggregate workspace fingerprint, selected and skipped repositories with selector reasons, per-repository status, context allocation and use, and scheduler/deadline diagnostics. Human-readable briefs show selected/skipped repository paths and the aggregate repository budget only when the workspace has multiple candidates.\n\nStage 3 intentionally does not add dependency-graph traversal, topology learning, learned routing, daemon behavior, or retry loops. Those remain later-stage work.\n'''
              docs_path.write_text(docs, encoding='utf-8')
          PY
      - name: Format Stage 3 quality targets
        shell: bash
        run: |
          ruff check --fix --select F401 ai_workflow/workspace_retrieval.py
          ruff format ai_workflow/workspace_selector.py ai_workflow/workspace_budget.py ai_workflow/workspace_retrieval.py
          python - <<'PY'
          from pathlib import Path

          path = Path('ai_workflow/workspace_retrieval.py')
          text = path.read_text(encoding='utf-8')
          needle = '        except Exception as exc:\n'
          if text.count(needle) != 1:
              raise RuntimeError('repository failure isolation boundary changed')
          text = text.replace(
              needle,
              '        except Exception as exc:  # noqa: BLE001 - isolate repository failures\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run focused Stage 3 tests
        run: python -m unittest tests.test_cli tests.test_brief_format tests.test_benchmark_metrics tests.test_workspace_retrieval tests.test_workspace_selector tests.test_workspace_budget -v
      - name: Remove temporary completion machinery before verification
        shell: bash
        run: rm -f scripts/stage3_tasks_6_8.py .github/workflows/stage3-tasks6-8-apply.yml
      - name: Run full unit suite and compile
        shell: bash
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q ai_workflow
      - name: Run Stage 3 focused quality gates
        shell: bash
        run: |
          ruff check --select E,F,UP,BLE,EXE ai_workflow/workspace_selector.py ai_workflow/workspace_budget.py ai_workflow/workspace_retrieval.py
          mypy --follow-imports=skip ai_workflow/workspace_selector.py ai_workflow/workspace_budget.py ai_workflow/workspace_retrieval.py
      - name: Run installation and benchmark regression gates
        shell: bash
        run: |
          python -m ai_workflow index
          python -m ai_workflow doctor --strict
          python -m ai_workflow benchmark --tasks benchmarks/sample-tasks.json --output benchmark-result.json > /dev/null
          python scripts/check_benchmark_regression.py benchmarks/baseline.json benchmark-result.json
      - name: Commit Tasks 6-8
        shell: bash
        run: |
          git config user.name "Stage3 CI"
          git config user.email "actions@users.noreply.github.com"
          git add ai_workflow/cli.py tests/test_cli.py
          git commit -m "feat: expose multi-repo retrieval in cli"
          git add ai_workflow/benchmark.py tests/test_benchmark_metrics.py tests/test_workspace_retrieval.py
          git commit -m "test: add multi-repo retrieval metrics"
          git add ai_workflow/workspace_selector.py ai_workflow/workspace_budget.py ai_workflow/workspace_retrieval.py
          git commit -m "style: satisfy stage3 retrieval quality gates"
          git add .github/workflows/tests.yml docs/multi-repo-workspace-registry.md
          git commit -m "docs: finalize stage3 multi-repo retrieval"
          git add -u scripts/stage3_tasks_6_8.py .github/workflows/stage3-tasks6-8-apply.yml
          git commit -m "chore: remove stage3 completion helper"
          git push origin HEAD:research/stage3-complete-retrieval
