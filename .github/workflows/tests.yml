name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: compatibility (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install quality tools
        run: python -m pip install -e ".[dev]"
      - name: Compile package
        run: python -m compileall -q ai_workflow
      - name: Workflow engine undefined-name gate
        run: ruff check --select F ai_workflow/workflow_engine.py
      - name: Ruff focused quality gate
        run: >-
          ruff check --select E,F,UP,BLE,EXE
          ai_workflow/retrieval_contracts.py
          ai_workflow/benchmark_protocol.py
          ai_workflow/benchmark_spans.py
          ai_workflow/benchmark_corpus.py
          ai_workflow/benchmark_ablation.py
          ai_workflow/benchmark_algorithm_ablation.py
          ai_workflow/benchmark_intervention.py
          ai_workflow/benchmark_statistics.py
          ai_workflow/benchmark_calibration.py
          ai_workflow/benchmark_policy_advisor.py
          ai_workflow/retrieval_learning.py
          ai_workflow/learning_ope.py
          ai_workflow/contextual_features.py
          ai_workflow/contextual_policy.py
          ai_workflow/policy_manifest.py
          ai_workflow/shadow_policy.py
          ai_workflow/deployment_state.py
          ai_workflow/deployment_guardrails.py
          ai_workflow/deployment_runtime.py
          ai_workflow/production_store.py
          ai_workflow/sqlite_runtime.py
          ai_workflow/deployment_statistics.py
          ai_workflow/observability_export.py
          ai_workflow/deployment_incident.py
          ai_workflow/benchmark_trajectory.py
          ai_workflow/retrieval_scheduler.py
          ai_workflow/path_policy.py
          ai_workflow/typed_config.py
          ai_workflow/benchmark_regression.py
          ai_workflow/execution_semantics.py
          ai_workflow/provenance.py
          ai_workflow/retrieval_cache.py
          ai_workflow/retrieval_adapters.py
          ai_workflow/api.py
          ai_workflow/provider_runner.py
          scripts/check_benchmark_regression.py
      - name: Mypy typed-boundary gate
        run: >-
          mypy --follow-imports=skip
          ai_workflow/retrieval_contracts.py
          ai_workflow/benchmark_protocol.py
          ai_workflow/benchmark_spans.py
          ai_workflow/benchmark_corpus.py
          ai_workflow/benchmark_ablation.py
          ai_workflow/benchmark_algorithm_ablation.py
          ai_workflow/benchmark_intervention.py
          ai_workflow/benchmark_statistics.py
          ai_workflow/benchmark_calibration.py
          ai_workflow/benchmark_policy_advisor.py
          ai_workflow/retrieval_learning.py
          ai_workflow/learning_ope.py
          ai_workflow/contextual_features.py
          ai_workflow/contextual_policy.py
          ai_workflow/policy_manifest.py
          ai_workflow/shadow_policy.py
          ai_workflow/deployment_state.py
          ai_workflow/deployment_guardrails.py
          ai_workflow/deployment_runtime.py
          ai_workflow/production_store.py
          ai_workflow/sqlite_runtime.py
          ai_workflow/deployment_statistics.py
          ai_workflow/observability_export.py
          ai_workflow/deployment_incident.py
          ai_workflow/benchmark_trajectory.py
          ai_workflow/path_policy.py
          ai_workflow/typed_config.py
          ai_workflow/benchmark_regression.py
          ai_workflow/execution_semantics.py
          ai_workflow/provenance.py
          ai_workflow/retrieval_cache.py
          ai_workflow/retrieval_adapters.py
          ai_workflow/api.py
          ai_workflow/provider_runner.py

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build pipx uv
          python -m build
      - name: Clean wheel smoke
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/ai-workflow" --version
      - name: pipx smoke
        shell: bash
        run: |
          export PIPX_HOME="$RUNNER_TEMP/pipx-home"
          export PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
          pipx install dist/*.whl
          "$PIPX_BIN_DIR/ai-workflow" --version
      - name: uv tool smoke
        shell: bash
        run: |
          export UV_TOOL_DIR="$RUNNER_TEMP/uv-tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin"
          uv tool install dist/*.whl
          "$UV_TOOL_BIN_DIR/ai-workflow" --version

  benchmark-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Prepare frozen benchmark fixture
        shell: bash
        run: |
          BASELINE_COMMIT="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("benchmarks/baseline.json").read_text())
          print(data["measured_from"]["commit"])
          PY
          )"
          test -n "$BASELINE_COMMIT"
          git fetch --no-tags --depth=1 origin "$BASELINE_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/benchmark-fixture" "$BASELINE_COMMIT"
          echo "BASELINE_COMMIT=$BASELINE_COMMIT" >> "$GITHUB_ENV"
          echo "BENCHMARK_FIXTURE=$RUNNER_TEMP/benchmark-fixture" >> "$GITHUB_ENV"
      - name: Capture clean corpus-v2 snapshot identity
        shell: bash
        run: |
          python -m ai_workflow --root "$BENCHMARK_FIXTURE" benchmark-corpus snapshot \
            --repository . --strict > "$RUNNER_TEMP/research-snapshot.json"
      - name: Build frozen fixture index and validate installation contract
        run: |
          python -m ai_workflow --root "$BENCHMARK_FIXTURE" index
          python -m ai_workflow --root "$BENCHMARK_FIXTURE" doctor --strict
      - name: Verify fixture remains clean after index
        shell: bash
        run: |
          python -m ai_workflow --root "$BENCHMARK_FIXTURE" benchmark-corpus snapshot \
            --repository . > "$RUNNER_TEMP/research-snapshot-after-index.json"
          cat "$RUNNER_TEMP/research-snapshot-after-index.json"
          test -z "$(git -C "$BENCHMARK_FIXTURE" status --porcelain=v1 --untracked-files=all)"
      - name: Run measured benchmark regression gate
        shell: bash
        run: |
          python -m ai_workflow --root "$BENCHMARK_FIXTURE" benchmark \
            --tasks "$BENCHMARK_FIXTURE/benchmarks/sample-tasks.json" \
            --output benchmark-result.json > /dev/null
          python scripts/check_benchmark_regression.py benchmarks/baseline.json benchmark-result.json
      - name: Run corpus-v2 span/frozen-content smoke
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          fixture = Path(os.environ["BENCHMARK_FIXTURE"])
          snapshot = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "research-snapshot.json").read_text()
          )
          source = fixture / "ai_workflow" / "math_retrieval.py"
          lines = source.read_text(encoding="utf-8").splitlines()
          start = next(
              index
              for index, line in enumerate(lines, 1)
              if "class BM25Scorer" in line
          )
          document = {
              "schema_version": 2,
              "corpus_id": "ci-research-smoke",
              "source": {
                  "name": "AI Workflow frozen CI fixture",
                  "url": "https://github.com/Taki7980/ai-workflow-control-plane-v2",
                  "license": "repository license",
              },
              "split": "ci",
              "cases": [
                  {
                      "schema_version": 2,
                      "case_id": "ci-comment2context-bm25",
                      "task": "Explain how BM25Scorer ranks documents",
                      "task_type": "comment2context",
                      "control_type": "positive",
                      "repository_id": "ci-fixture",
                      "repository_path": ".",
                      "base_commit": snapshot["actual_head"],
                      "content_manifest_sha256": snapshot[
                          "content_manifest_sha256"
                      ],
                      "symbol": "BM25Scorer",
                      "gold_files": ["ai_workflow/math_retrieval.py"],
                      "gold_spans": [
                          {
                              "path": "ai_workflow/math_retrieval.py",
                              "start_line": start,
                              "end_line": min(start + 25, len(lines)),
                          }
                      ],
                      "language": "python",
                      "label_source": "deterministic_ci_fixture",
                      "labeler_count": 1,
                      "budget_tokens": 1200,
                      "budget_lines": 80,
                      "retrieval_k": 5,
                  }
              ],
          }
          Path("research-smoke-v2.json").write_text(
              json.dumps(document, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python -m ai_workflow benchmark-corpus validate \
            --input research-smoke-v2.json > /dev/null
          python -m ai_workflow --root "$BENCHMARK_FIXTURE" benchmark \
            --tasks research-smoke-v2.json \
            --research-protocol \
            --require-frozen-snapshot \
            --output research-smoke-result.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("research-smoke-result.json").read_text())
          case = data["cases"][0]
          assert case["snapshot"]["match"] is True
          assert case["snapshot"]["worktree_clean"] is True
          assert "span_retrieval" in case
          assert case["span_retrieval"]["line_recall"] > 0
          assert data["research_protocol"]["span_level_gold_supported"] is True
          PY
      - name: Print measured benchmark summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("benchmark-result.json").read_text())
          print("BENCHMARK_SUMMARY=" + json.dumps(data["summary"], sort_keys=True))
          print("BENCHMARK_BY_QUERY_TYPE=" + json.dumps(data["by_query_type"], sort_keys=True))
          PY
