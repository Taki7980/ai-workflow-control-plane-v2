name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lock-contract:
    name: locked Python inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Verify committed lock matches project metadata
        run: uv lock --check

  compatibility:
    name: compatibility (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11.16"
          - os: ubuntu-latest
            python-version: "3.12.14"
          - os: ubuntu-latest
            python-version: "3.13.15"
          - os: ubuntu-latest
            python-version: "3.14.7"
          - os: windows-latest
            python-version: "3.14.7"
          - os: macos-latest
            python-version: "3.14.7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v


  crg-contract:
    name: Code Review Graph contract (2.3.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync locked CRG toolchain
        run: uv sync --locked --only-group crg
      - name: Verify pinned CRG executable
        run: uv run --locked --no-sync code-review-graph --version
      - name: Run real graph contract test
        run: uv run --locked --no-sync python -m unittest tests.integration.test_code_review_graph_real -v
      - name: Run CRG semantic golden benchmark
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync python scripts/run_crg_semantic_benchmark.py \
            --output "$RUNNER_TEMP/crg-semantic-report.json"
          cat "$RUNNER_TEMP/crg-semantic-report.json"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync locked quality tools
        run: uv sync --locked --only-group dev
      - name: Compile package
        run: uv run --locked --no-sync python -m compileall -q ai_workflow
      - name: Repository hygiene gate
        run: uv run --locked --no-sync python scripts/check_repository_hygiene.py --root .
      - name: Ruff whole-repository quality gate
        run: uv run --locked --no-sync ruff check ai_workflow tests security_tests scripts
      - name: Mypy whole-package gate
        run: uv run --locked --no-sync mypy ai_workflow

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync locked package toolchain
        run: uv sync --locked --only-group package-smoke
      - name: Build wheel and sdist from locked build inputs
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync python -m build --no-isolation --report "$RUNNER_TEMP/build-report.json"
          uv run --locked --no-sync python scripts/record_python_toolchain.py \
            --package build \
            --package setuptools \
            --package pipx \
            --output "$RUNNER_TEMP/python-build-toolchain.json"
          cat "$RUNNER_TEMP/build-report.json"
          cat "$RUNNER_TEMP/python-build-toolchain.json"
      - name: Clean wheel smoke
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/ai-workflow" --version
      - name: pipx smoke
        shell: bash
        run: |
          export PIPX_HOME="$RUNNER_TEMP/pipx-home"
          export PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
          uv run --locked --no-sync pipx install dist/*.whl
          "$PIPX_BIN_DIR/ai-workflow" --version
      - name: uv tool smoke
        shell: bash
        run: |
          export UV_TOOL_DIR="$RUNNER_TEMP/uv-tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin"
          uv tool install dist/*.whl
          "$UV_TOOL_BIN_DIR/ai-workflow" --version

  portable-binary-smoke:
    name: portable binary smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ""
          - os: windows-latest
            exe: ".exe"
          - os: macos-latest
            exe: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync locked portable-build toolchain
        run: uv sync --locked --only-group portable
      - name: Build native portable executable
        shell: bash
        run: |
          uv run --locked --no-sync python -m PyInstaller --clean --onefile --name ai-workflow packaging/entrypoint.py
          uv run --locked --no-sync python scripts/record_python_toolchain.py \
            --package pyinstaller \
            --output "$RUNNER_TEMP/portable-toolchain.json"
          cat "$RUNNER_TEMP/portable-toolchain.json"
      - name: Smoke portable executable
        shell: bash
        run: '"./dist/ai-workflow${{ matrix.exe }}" --version'

  docker-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.37.0
          driver-opts: >-
            image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - name: Derive reproducible source timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Build reproducibility candidate A
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --no-cache \
            --platform linux/amd64 \
            --build-arg SOURCE_DATE_EPOCH \
            --build-arg BUILDKIT_MULTI_PLATFORM=1 \
            --provenance=false \
            --output type=image,name=ai-workflow-repro-a,push=false,rewrite-timestamp=true,compatibility-version=30 \
            --metadata-file "$RUNNER_TEMP/repro-a.json" \
            .
      - name: Build reproducibility candidate B and compare release-image digest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --no-cache \
            --platform linux/amd64 \
            --build-arg SOURCE_DATE_EPOCH \
            --build-arg BUILDKIT_MULTI_PLATFORM=1 \
            --provenance=false \
            --output type=image,name=ai-workflow-repro-b,push=false,rewrite-timestamp=true,compatibility-version=30 \
            --metadata-file "$RUNNER_TEMP/repro-b.json" \
            .
          first="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/repro-a.json")"
          second="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/repro-b.json")"
          test -n "$first" && test "$first" != "null"
          test -n "$second" && test "$second" != "null"
          printf 'candidate_a=%s\ncandidate_b=%s\n' "$first" "$second"
          test "$first" = "$second"
      - name: Smoke Docker-loaded image separately
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --build-arg SOURCE_DATE_EPOCH \
            --output type=docker,rewrite-timestamp=true \
            --tag ai-workflow-install-smoke \
            .
          docker run --rm ai-workflow-install-smoke --version

  bootstrap-installer-smoke:
    name: bootstrap installer smoke (${{ matrix.installer }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            installer: shell
          - os: windows-latest
            installer: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Run deterministic bootstrap installer smoke
        run: python scripts/smoke_bootstrap_install.py --installer ${{ matrix.installer }}

  benchmark-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Prepare frozen benchmark fixture
        shell: bash
        run: |
          BASELINE_COMMIT="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("benchmarks/baseline.json").read_text())
          print(data["measured_from"]["commit"])
          PY
          )"
          test -n "$BASELINE_COMMIT"
          git fetch --no-tags --depth=1 origin "$BASELINE_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/benchmark-fixture" "$BASELINE_COMMIT"
          echo "BASELINE_COMMIT=$BASELINE_COMMIT" >> "$GITHUB_ENV"
          echo "BENCHMARK_FIXTURE=$RUNNER_TEMP/benchmark-fixture" >> "$GITHUB_ENV"
      - name: Capture clean corpus-v2 snapshot identity
        shell: bash
        run: |
          python -m ai_workflow --root "$BENCHMARK_FIXTURE" benchmark-corpus snapshot \
            --repository . --strict > "$RUNNER_TEMP/research-snapshot.json"
      - name: Build frozen fixture index and validate index contract
        shell: bash
        run: |
          python -m ai_workflow --root "$BENCHMARK_FIXTURE" index
          # The frozen benchmark commit intentionally predates current repository
          # hygiene policy. Validate index health without treating historical
          # tracked artifacts as current-workspace hygiene failures.
          python -m ai_workflow --root "$BENCHMARK_FIXTURE" doctor \
            > "$RUNNER_TEMP/benchmark-doctor.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "benchmark-doctor.json").read_text()
          )
          assert data["index"]["present"] is True
          assert data["index"]["stale_files"] == 0
          assert data["repository_indexes"]
          assert all(
              row["present"] and row["stale_files"] == 0
              for row in data["repository_indexes"]
          )
          PY
      - name: Verify fixture remains clean after index
        shell: bash
        run: |
          python -m ai_workflow --root "$BENCHMARK_FIXTURE" benchmark-corpus snapshot \
            --repository . > "$RUNNER_TEMP/research-snapshot-after-index.json"
          cat "$RUNNER_TEMP/research-snapshot-after-index.json"
          test -z "$(git -C "$BENCHMARK_FIXTURE" status --porcelain=v1 --untracked-files=all)"
      - name: Run corpus-v2 span/frozen-content smoke
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          fixture = Path(os.environ["BENCHMARK_FIXTURE"])
          snapshot = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "research-snapshot.json").read_text()
          )
          source = fixture / "ai_workflow" / "math_retrieval.py"
          lines = source.read_text(encoding="utf-8").splitlines()
          start = next(
              index
              for index, line in enumerate(lines, 1)
              if "class BM25Scorer" in line
          )
          document = {
              "schema_version": 2,
              "corpus_id": "ci-research-smoke",
              "source": {
                  "name": "AI Workflow frozen CI fixture",
                  "url": "https://github.com/Taki7980/ai-workflow-control-plane-v2",
                  "license": "repository license",
              },
              "split": "ci",
              "cases": [
                  {
                      "schema_version": 2,
                      "case_id": "ci-comment2context-bm25",
                      "task": "Explain how BM25Scorer ranks documents",
                      "task_type": "comment2context",
                      "control_type": "positive",
                      "repository_id": "ci-fixture",
                      "repository_path": ".",
                      "base_commit": snapshot["actual_head"],
                      "content_manifest_sha256": snapshot[
                          "content_manifest_sha256"
                      ],
                      "symbol": "BM25Scorer",
                      "gold_files": ["ai_workflow/math_retrieval.py"],
                      "gold_spans": [
                          {
                              "path": "ai_workflow/math_retrieval.py",
                              "start_line": start,
                              "end_line": min(start + 25, len(lines)),
                          }
                      ],
                      "language": "python",
                      "label_source": "deterministic_ci_fixture",
                      "labeler_count": 1,
                      "budget_tokens": 1200,
                      "budget_lines": 80,
                      "retrieval_k": 5,
                  }
              ],
          }
          Path("research-smoke-v2.json").write_text(
              json.dumps(document, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python -m ai_workflow benchmark-corpus validate \
            --input research-smoke-v2.json > /dev/null
          python -m ai_workflow --root "$BENCHMARK_FIXTURE" benchmark \
            --tasks research-smoke-v2.json \
            --research-protocol \
            --require-frozen-snapshot \
            --output research-smoke-result.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("research-smoke-result.json").read_text())
          case = data["cases"][0]
          assert case["snapshot"]["match"] is True
          assert case["snapshot"]["worktree_clean"] is True
          assert "span_retrieval" in case
          assert case["span_retrieval"]["line_recall"] > 0
          assert data["research_protocol"]["span_level_gold_supported"] is True
          assert (
              data["research_protocol"][
                  "persistent_project_knowledge_isolated"
              ]
              is True
          )
          PY
          test -z "$(git -C "$BENCHMARK_FIXTURE" status --porcelain=v1 --untracked-files=all)"
      - name: Verify retrieval core ranking parity
        run: python scripts/check_retrieval_performance.py --documents 800 --queries 40
      - name: Run measured benchmark regression gate
        shell: bash
        run: |
          python -m ai_workflow --root "$BENCHMARK_FIXTURE" benchmark \
            --tasks "$BENCHMARK_FIXTURE/benchmarks/sample-tasks.json" \
            --output benchmark-result.json > /dev/null
          python scripts/check_benchmark_regression.py benchmarks/baseline.json benchmark-result.json
      - name: Print measured benchmark summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("benchmark-result.json").read_text())
          print("BENCHMARK_SUMMARY=" + json.dumps(data["summary"], sort_keys=True))
          print("BENCHMARK_BY_QUERY_TYPE=" + json.dumps(data["by_query_type"], sort_keys=True))
          PY
