name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: compatibility (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install quality tools
        run: python -m pip install -e ".[dev]"
      - name: Compile package
        run: python -m compileall -q ai_workflow
      - name: Ruff focused quality gate
        run: >-
          ruff check --select E,F,UP,BLE,EXE
          ai_workflow/retrieval_contracts.py
          ai_workflow/benchmark_protocol.py
          ai_workflow/retrieval_scheduler.py
          ai_workflow/path_policy.py
          ai_workflow/typed_config.py
          ai_workflow/benchmark_regression.py
          ai_workflow/execution_semantics.py
          ai_workflow/provenance.py
          ai_workflow/retrieval_cache.py
          ai_workflow/retrieval_adapters.py
          ai_workflow/api.py
          ai_workflow/provider_runner.py
          scripts/check_benchmark_regression.py
      - name: Mypy typed-boundary gate
        run: >-
          mypy --follow-imports=skip
          ai_workflow/retrieval_contracts.py
          ai_workflow/benchmark_protocol.py
          ai_workflow/path_policy.py
          ai_workflow/typed_config.py
          ai_workflow/benchmark_regression.py
          ai_workflow/execution_semantics.py
          ai_workflow/provenance.py
          ai_workflow/retrieval_cache.py
          ai_workflow/retrieval_adapters.py
          ai_workflow/api.py
          ai_workflow/provider_runner.py

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build pipx uv
          python -m build
      - name: Clean wheel smoke
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/ai-workflow" --version
      - name: pipx smoke
        shell: bash
        run: |
          export PIPX_HOME="$RUNNER_TEMP/pipx-home"
          export PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
          pipx install dist/*.whl
          "$PIPX_BIN_DIR/ai-workflow" --version
      - name: uv tool smoke
        shell: bash
        run: |
          export UV_TOOL_DIR="$RUNNER_TEMP/uv-tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin"
          uv tool install dist/*.whl
          "$UV_TOOL_BIN_DIR/ai-workflow" --version

  benchmark-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Prepare frozen benchmark fixture
        shell: bash
        run: |
          BASELINE_COMMIT="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("benchmarks/baseline.json").read_text())
          print(data["measured_from"]["commit"])
          PY
          )"
          test -n "$BASELINE_COMMIT"
          git fetch --no-tags --depth=1 origin "$BASELINE_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/benchmark-fixture" "$BASELINE_COMMIT"
          echo "BASELINE_COMMIT=$BASELINE_COMMIT" >> "$GITHUB_ENV"
          echo "BENCHMARK_FIXTURE=$RUNNER_TEMP/benchmark-fixture" >> "$GITHUB_ENV"
      - name: Build frozen fixture index and validate installation contract
        run: |
          python -m ai_workflow --root "$BENCHMARK_FIXTURE" index
          python -m ai_workflow --root "$BENCHMARK_FIXTURE" doctor --strict
      - name: Run measured benchmark regression gate
        shell: bash
        run: |
          python -m ai_workflow --root "$BENCHMARK_FIXTURE" benchmark \
            --tasks "$BENCHMARK_FIXTURE/benchmarks/sample-tasks.json" \
            --output benchmark-result.json > /dev/null
          python scripts/check_benchmark_regression.py benchmarks/baseline.json benchmark-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("benchmark-result.json").read_text())
          print("BENCHMARK_SUMMARY=" + json.dumps(data["summary"], sort_keys=True))
          print("BENCHMARK_BY_QUERY_TYPE=" + json.dumps(data["by_query_type"], sort_keys=True))
          PY
