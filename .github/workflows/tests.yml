name: Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Run unit tests
      run: python -m unittest discover -s tests -v
    - name: Benchmark smoke gate
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      shell: bash
      run: |
        python -m ai_workflow index
        python -m ai_workflow benchmark --tasks benchmarks/sample-tasks.json --output benchmark-result.json > /dev/null
        python - <<'PY'
        import json
        from pathlib import Path
        data = json.loads(Path('benchmark-result.json').read_text())
        summary = data['summary']
        assert summary['cases'] >= 32, summary
        assert len(data.get('by_query_type', {})) >= 7, data.get('by_query_type')
        assert summary['lane_accuracy'] is not None
        assert summary['intent_accuracy'] is not None
        assert summary['evidence_state_accuracy'] is not None
        assert summary['abstention_accuracy'] is not None
        assert summary['mean_relevant_item_density'] is not None
        assert summary['mean_pattern_yield_per_1k_tokens'] is not None
        PY
