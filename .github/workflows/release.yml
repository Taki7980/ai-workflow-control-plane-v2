name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize-release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Authorize exact tagged SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python scripts/verify_release_authorization.py
          --release-branch main
          --output "$RUNNER_TEMP/release-authorization.json"
      - name: Show authorization evidence
        shell: bash
        run: cat "$RUNNER_TEMP/release-authorization.json"

  prepare-release:
    needs: authorize-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Re-authorize exact tagged SHA after release approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python scripts/verify_release_authorization.py
          --release-branch main
          --output release-authorization.json
      - name: Verify committed release lock
        run: uv lock --check
      - name: Validate tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          actual="$(python -c 'from ai_workflow import __version__; print(__version__)')"
          test "$expected" = "$actual" || {
            echo "tag version $expected does not match package version $actual" >&2
            exit 1
          }
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists; reusing it"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "AI Workflow $GITHUB_REF_NAME"
          fi
      - name: Attest release authorization evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-authorization.json
      - name: Attach release authorization evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" release-authorization.json --clobber

  publish-pypi:
    needs: prepare-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync locked Python build toolchain
        run: uv sync --locked --only-group build
      - name: Build Python distributions from locked inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          uv run --locked --no-sync python -m build --no-isolation --report "$RUNNER_TEMP/build-report.json"
          uv run --locked --no-sync python scripts/record_python_toolchain.py \
            --package build \
            --package setuptools \
            --output release-metadata/python-build-toolchain.json
          python -m venv "$RUNNER_TEMP/release-smoke"
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/release-smoke/bin/ai-workflow" --version
          cat "$RUNNER_TEMP/build-report.json"
          cat release-metadata/python-build-toolchain.json
      - name: Attest Python distributions and build toolchain
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*
            release-metadata/python-build-toolchain.json
      - name: Attach Python distributions to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          dist/* release-metadata/python-build-toolchain.json --clobber
      - name: Publish package distributions to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  portable-binaries:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
            exe: ""
          - os: windows-latest
            suffix: windows-x86_64
            exe: ".exe"
          - os: macos-latest
            suffix: macos-arm64
            exe: ""
          - os: macos-15-intel
            suffix: macos-x86_64
            exe: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync locked portable-build toolchain
        run: uv sync --locked --only-group portable
      - name: Build portable executable
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync python -m PyInstaller --clean --onefile --name ai-workflow packaging/entrypoint.py
          version="${GITHUB_REF_NAME#v}"
          asset="ai-workflow-v${version}-${{ matrix.suffix }}${{ matrix.exe }}"
          mkdir -p release
          mv "dist/ai-workflow${{ matrix.exe }}" "release/$asset"
          toolchain="release/$asset.toolchain.json"
          uv run --locked --no-sync python scripts/record_python_toolchain.py \
            --package pyinstaller \
            --output "$toolchain"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "path=release/$asset" >> "$GITHUB_OUTPUT"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          cat "$toolchain"
      - name: Smoke portable executable
        shell: bash
        run: '"./${{ steps.asset.outputs.path }}" --version'
      - name: Attest portable executable and toolchain
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.asset.outputs.path }}
            ${{ steps.asset.outputs.toolchain }}
      - name: Attach portable executable to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          "${{ steps.asset.outputs.path }}"
          "${{ steps.asset.outputs.toolchain }}"
          --clobber

  container:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.37.0
          driver-opts: >-
            image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - name: Derive reproducible source timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push container from locked inputs with provenance and SBOM
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg SOURCE_DATE_EPOCH \
            --build-arg BUILDKIT_MULTI_PLATFORM=1 \
            --provenance=mode=max,version=v1 \
            --sbom=true \
            --output "type=image,name=$image:$GITHUB_REF_NAME,push=true,rewrite-timestamp=true,compatibility-version=30" \
            --metadata-file build-metadata.json \
            .
          digest="$(jq -r '."containerimage.digest"' build-metadata.json)"
          test -n "$digest" && test "$digest" != "null"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Export and verify container provenance and SBOM
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}"
          docker buildx imagetools inspect "$ref" \
            --format '{{ json .Provenance.SLSA }}' > container-provenance.json
          docker buildx imagetools inspect "$ref" \
            --format '{{ json .SBOM.SPDX }}' > container-sbom.spdx.json
          python scripts/verify_container_attestations.py \
            --provenance container-provenance.json \
            --sbom container-sbom.spdx.json
      - name: Attest pushed container image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest exported container metadata
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            container-provenance.json
            container-sbom.spdx.json
      - name: Attach inspectable container metadata to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          container-provenance.json
          container-sbom.spdx.json
          --clobber

  finalize-release:
    needs: [publish-pypi, portable-binaries, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Download release assets and create checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets --clobber
          rm -f release-assets/SHA256SUMS
          rm -f release-assets/Taki7980.AIWorkflow*.yaml release-assets/ai-workflow.rb release-assets/meta.yaml
          (cd release-assets && sha256sum * > ../SHA256SUMS)
      - name: Render package-manager manifests from verified asset digests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_distribution_manifests.py \
            --version "${GITHUB_REF_NAME#v}" \
            --checksums SHA256SUMS \
            --output-dir release-manifests
      - name: Attest checksums and rendered manifests
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            SHA256SUMS
            release-manifests/*
      - name: Upload release metadata and publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS release-manifests/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

  verify-release:
    needs: finalize-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets --clobber
      - name: Verify published SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS
      - name: Verify published release authorization evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg sha "$GITHUB_SHA" --arg tag "$GITHUB_REF_NAME" '
            .authorized == true
            and .repository_sha == $sha
            and .tag_commit == $sha
            and .tag == $tag
            and .release_branch == "main"
            and .release_branch_protected == true
            and .tag_reachable_from_release_branch == true
            and (.required_workflows | length == 3)
          ' release-assets/release-authorization.json >/dev/null
      - name: Verify published artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while read -r _ name; do
            test -n "$name"
            gh attestation verify "release-assets/$name" \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done < release-assets/SHA256SUMS
          for name in             SHA256SUMS             Taki7980.AIWorkflow.yaml             Taki7980.AIWorkflow.installer.yaml             Taki7980.AIWorkflow.locale.en-US.yaml             ai-workflow.rb             meta.yaml
          do
            gh attestation verify "release-assets/$name" \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
      - name: Verify published container attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gh attestation verify "oci://$image:$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
      - name: Smoke checksum-verifying published bootstrap installer
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          AI_WORKFLOW_VERSION="$version"           AI_WORKFLOW_INSTALL_DIR="$RUNNER_TEMP/ai-workflow-bin"             ./install.sh
          "$RUNNER_TEMP/ai-workflow-bin/ai-workflow" --version

