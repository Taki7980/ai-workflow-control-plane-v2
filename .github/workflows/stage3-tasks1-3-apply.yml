name: Stage3 Tasks1-3 Apply

on:
  push:
    branches:
      - research/stage3-multi-repo-retrieval
    paths:
      - .github/workflows/stage3-tasks1-3-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/stage3-multi-repo-retrieval
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Write tests
        run: python scripts/stage3_tasks_1_3.py tests
      - name: Confirm red phase
        shell: bash
        run: |
          if python -m unittest tests.test_workspace_selector tests.test_workspace_budget -v; then
            echo "Expected Stage 3 selector/budget tests to fail before implementation"
            exit 1
          fi
          echo "Red phase confirmed"
      - name: Apply implementation
        run: python scripts/stage3_tasks_1_3.py impl
      - name: Verify selector and budget tests
        run: python -m unittest tests.test_workspace_selector tests.test_workspace_budget -v
      - name: Verify config regressions
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_config*.py' -v
          python -m compileall -q ai_workflow
      - name: Commit verified selector contracts
        shell: bash
        run: |
          git config user.name "Stage3 CI"
          git config user.email "actions@users.noreply.github.com"
          git add ai_workflow/config.py ai_workflow/workspace_selector.py tests/test_workspace_selector.py
          git commit -m "feat: add deterministic repository selection"
      - name: Commit verified budget allocator
        shell: bash
        run: |
          git add ai_workflow/workspace_budget.py tests/test_workspace_budget.py
          git commit -m "feat: conserve context budget across repositories"
          git push origin HEAD:research/stage3-multi-repo-retrieval
