name: PR21 Semantic Measurement

on:
  push:
    branches:
      - benchmark/pr-21-crg-semantic-golden

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.14"
          enable-cache: false
      - name: Sync pinned CRG toolchain
        run: uv sync --locked --only-group crg
      - name: Run semantic benchmark
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-sync code-review-graph --version
          uv run --locked --no-sync python scripts/run_crg_semantic_benchmark.py \
            --output "$RUNNER_TEMP/crg-semantic-report.json"
          echo "PR21_REPORT_BEGIN"
          cat "$RUNNER_TEMP/crg-semantic-report.json"
          echo "PR21_REPORT_END"
