[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-control-plane"
version = "2.2.0"
description = "Agent-agnostic adaptive efficiency control plane for AI-assisted software development"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kisuke"}]
dependencies = []

[project.scripts]
ai-workflow = "ai_workflow.cli:main"

[tool.setuptools.packages.find]
include = ["ai_workflow*"]
