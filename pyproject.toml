[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-control-plane"
dynamic = ["version"]
description = "Agent-agnostic adaptive efficiency control plane for AI-assisted software development"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE*"]
authors = [{name = "Kisuke"}]
dependencies = []

[project.urls]
Repository = "https://github.com/Taki7980/ai-workflow-control-plane-v2"
Issues = "https://github.com/Taki7980/ai-workflow-control-plane-v2/issues"

[dependency-groups]
build = [
  "build==1.6.1",
  "setuptools==84.0.0",
]
dev = [
  "mypy==2.3.1",
  "ruff==0.16.7",
]
security = [
  "coverage==7.16.0",
  "hypothesis==6.168.0",
  "pip-audit==2.10.1",
  "pip-licenses==5.5.5",
  "ruff==0.16.7",
]
crg = [
  "code-review-graph==2.3.8",
]
portable = [
  "pyinstaller==6.22.3",
]
package-smoke = [
  "build==1.6.1",
  "pipx==1.17.4",
  "setuptools==84.0.0",
]

[project.scripts]
ai-workflow = "ai_workflow.entrypoint:main"
ai-workflow-setup = "ai_workflow.easy_setup:main"
ai-workflow-research = "ai_workflow.research_scout:main"

[tool.setuptools.dynamic]
version = {attr = "ai_workflow._version.__version__"}

[tool.setuptools.packages.find]
include = ["ai_workflow*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F", "B", "BLE", "EXE"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_configs = true
